<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="1000" height="700" fill="#ffffff"/>
  <text x="20" y="28" font-size="17" font-weight="bold">BUS_PWR_ACTIVE sense + output-enable interlock (a2mega 1.0a4, Apple II bus sheet)</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#000"/>
    </marker>
  </defs>

  <!-- ===== BUS_5V rail ===== -->
  <line x1="90" y1="80" x2="470" y2="80" stroke="#000" stroke-width="2"/>
  <text x="20" y="76" font-weight="bold">BUS_5V</text>
  <text x="20" y="110" font-size="11" fill="#444">(slot pin 25, upstream of LM74700)</text>

  <!-- C1 0.1uF bypass -->
  <line x1="110" y1="80" x2="110" y2="180" stroke="#000" stroke-width="1.5"/>
  <line x1="95" y1="180" x2="125" y2="180" stroke="#000" stroke-width="2.5"/>
  <line x1="95" y1="190" x2="125" y2="190" stroke="#000" stroke-width="2.5"/>
  <line x1="110" y1="190" x2="110" y2="330" stroke="#000" stroke-width="1.5"/>
  <text x="60" y="176" text-anchor="end">C1</text><text x="60" y="192" text-anchor="end">0.1 µF</text>

  <!-- Supervisor U -->
  <rect x="170" y="160" width="160" height="120" fill="#f4f4f4" stroke="#000" stroke-width="1.5"/>
  <text x="250" y="205" text-anchor="middle" font-weight="bold">TLV803EA43DBZR</text>
  <text x="250" y="224" text-anchor="middle" font-size="11">SOT-23-3 (standard pinout)</text>
  <text x="250" y="240" text-anchor="middle" font-size="11">4.38 V falling, 200 ms release</text>
  <text x="250" y="256" text-anchor="middle" font-size="11">open-drain active-low</text>
  <!-- VDD pin 3 -->
  <line x1="250" y1="80" x2="250" y2="160" stroke="#000" stroke-width="1.5"/>
  <text x="256" y="150" font-size="11">3 VDD</text>
  <!-- GND pin 1 -->
  <line x1="250" y1="280" x2="250" y2="330" stroke="#000" stroke-width="1.5"/>
  <text x="256" y="300" font-size="11">1 GND</text>
  <!-- RESET pin 2 -->
  <line x1="330" y1="220" x2="400" y2="220" stroke="#000" stroke-width="1.5"/>
  <text x="335" y="214" font-size="11">2 RESET (OD)</text>

  <!-- Ra 22k from rail to node -->
  <line x1="440" y1="80" x2="440" y2="130" stroke="#000" stroke-width="1.5"/>
  <rect x="430" y="130" width="20" height="60" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <line x1="440" y1="190" x2="440" y2="220" stroke="#000" stroke-width="1.5"/>
  <text x="458" y="165">Ra 22 kΩ</text>

  <!-- node -->
  <line x1="400" y1="220" x2="620" y2="220" stroke="#000" stroke-width="2"/>
  <circle cx="440" cy="220" r="3.5" fill="#000"/>
  <circle cx="540" cy="220" r="3.5" fill="#000"/>
  <text x="455" y="212" font-weight="bold">BUS_PWR_ACTIVE</text>

  <!-- Rb 33k node to GND -->
  <line x1="440" y1="220" x2="440" y2="250" stroke="#000" stroke-width="1.5"/>
  <rect x="430" y="250" width="20" height="60" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <line x1="440" y1="310" x2="440" y2="330" stroke="#000" stroke-width="1.5"/>
  <text x="424" y="285" text-anchor="end">Rb 33 kΩ</text>
  <!-- optional C across Rb -->
  <line x1="520" y1="250" x2="520" y2="275" stroke="#000" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="508" y1="275" x2="532" y2="275" stroke="#000" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="508" y1="285" x2="532" y2="285" stroke="#000" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="520" y1="285" x2="520" y2="310" stroke="#000" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="440" y1="250" x2="520" y2="250" stroke="#000" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="440" y1="310" x2="520" y2="310" stroke="#000" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="540" y="284" font-size="11" fill="#444">1 nF (optional)</text>

  <!-- GND bus -->
  <line x1="110" y1="330" x2="440" y2="330" stroke="#000" stroke-width="2"/>
  <line x1="260" y1="330" x2="260" y2="345" stroke="#000" stroke-width="2"/>
  <line x1="240" y1="345" x2="280" y2="345" stroke="#000" stroke-width="2"/>
  <line x1="247" y1="352" x2="273" y2="352" stroke="#000" stroke-width="2"/>
  <line x1="254" y1="359" x2="266" y2="359" stroke="#000" stroke-width="2"/>
  <text x="290" y="358">GND</text>

  <!-- to FPGA input -->
  <line x1="620" y1="220" x2="700" y2="220" stroke="#000" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="705" y="190" width="270" height="60" fill="#eef4ff" stroke="#000" stroke-width="1.5"/>
  <text x="840" y="212" text-anchor="middle" font-weight="bold">FPGA input ball</text>
  <text x="840" y="230" text-anchor="middle" font-size="11">a2_bus_pwr_active — LVCMOS33, no pull,</text>
  <text x="840" y="244" text-anchor="middle" font-size="11">HYSTERESIS on; 2-flop sync in gateware</text>

  <!-- ===== Interlock FET ===== -->
  <!-- gate feed from node -->
  <line x1="540" y1="220" x2="540" y2="470" stroke="#000" stroke-width="1.5"/>
  <line x1="540" y1="470" x2="600" y2="470" stroke="#000" stroke-width="1.5"/>
  <!-- MOSFET symbol: gate plate x=600, channel x=612 -->
  <line x1="600" y1="445" x2="600" y2="495" stroke="#000" stroke-width="2"/>
  <line x1="612" y1="440" x2="612" y2="456" stroke="#000" stroke-width="2.5"/>
  <line x1="612" y1="462" x2="612" y2="478" stroke="#000" stroke-width="2.5"/>
  <line x1="612" y1="484" x2="612" y2="500" stroke="#000" stroke-width="2.5"/>
  <!-- drain -->
  <line x1="612" y1="448" x2="640" y2="448" stroke="#000" stroke-width="1.5"/>
  <line x1="640" y1="448" x2="640" y2="400" stroke="#000" stroke-width="1.5"/>
  <!-- source with arrow -->
  <line x1="612" y1="492" x2="640" y2="492" stroke="#000" stroke-width="1.5"/>
  <path d="M614,448 L626,442 L626,454 z" fill="#000"/>
  <line x1="640" y1="492" x2="640" y2="560" stroke="#000" stroke-width="1.5"/>
  <!-- body connection (bulk to source) -->
  <line x1="612" y1="470" x2="640" y2="470" stroke="#000" stroke-width="1.5"/>
  <line x1="640" y1="448" x2="640" y2="470" stroke="#000" stroke-width="1.5"/>
  <!-- body diode (dashed) S->D beside symbol -->
  <line x1="668" y1="448" x2="668" y2="466" stroke="#000" stroke-width="1.2" stroke-dasharray="4 3"/>
  <path d="M660,466 L676,466 L668,480 z" fill="none" stroke="#000" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="660" y1="480" x2="676" y2="480" stroke="#000" stroke-width="1.5"/>
  <line x1="668" y1="480" x2="668" y2="492" stroke="#000" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="640" y1="448" x2="668" y2="448" stroke="#000" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="640" y1="492" x2="668" y2="492" stroke="#000" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="690" y="520" font-size="11" fill="#444">dashed = body diode (S→D)</text>
  <text x="690" y="534" font-size="11" fill="#444">only pulls the OE net up</text>
  <text x="520" y="500" font-weight="bold">Q1 BSS138</text>
  <text x="546" y="462" font-size="11">G (pin 1)</text>
  <text x="646" y="440" font-size="11">S (pin 2)</text>
  <text x="646" y="556" font-size="11">D (pin 3)</text>

  <!-- Drain to FPGA OE output -->
  <line x1="640" y1="400" x2="700" y2="400" stroke="#000" stroke-width="1.5"/>
  <rect x="705" y="375" width="270" height="50" fill="#eef4ff" stroke="#000" stroke-width="1.5"/>
  <text x="840" y="396" text-anchor="middle" font-weight="bold">FPGA OE output ball (was J1-13)</text>
  <text x="840" y="414" text-anchor="middle" font-size="11">new net: FPGA_BUS_~OE_DRV (LVCMOS33 output)</text>

  <!-- Source to existing OE net -->
  <line x1="640" y1="560" x2="960" y2="560" stroke="#000" stroke-width="2"/>
  <text x="650" y="580" font-weight="bold">FPGA_BUS_~OE  (existing net, unchanged loads)</text>
  <text x="650" y="598" font-size="11">→ U1, U2  ~1OE / ~2OE  (pins 48, 25)</text>
  <text x="650" y="613" font-size="11">→ U5 74LVC2G06 input (drives LSF0108 EN low when OE is high)</text>

  <!-- existing R7 pull-up to +3V3 -->
  <circle cx="880" cy="560" r="3.5" fill="#000"/>
  <line x1="880" y1="560" x2="880" y2="530" stroke="#000" stroke-width="1.5"/>
  <rect x="870" y="470" width="20" height="60" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <line x1="880" y1="470" x2="880" y2="445" stroke="#000" stroke-width="1.5"/>
  <line x1="865" y1="445" x2="895" y2="445" stroke="#000" stroke-width="2"/>
  <text x="900" y="450" font-weight="bold">+3V3</text>
  <text x="898" y="500">R7 4.7 kΩ</text><text x="898" y="515">(existing)</text>

  <!-- ===== Notes ===== -->
  <rect x="20" y="380" width="490" height="300" fill="#fffbe6" stroke="#c9b458" stroke-width="1"/>
  <text x="32" y="402" font-weight="bold">How it behaves</text>
  <text x="32" y="424" font-size="12">Apple off (BUS_5V = 0 V): node = 0 V by the divider alone. Q1 off.</text>
  <text x="32" y="440" font-size="12">R7 holds FPGA_BUS_~OE high → transceivers and LSF disabled,</text>
  <text x="32" y="456" font-size="12">whatever the FPGA drives on its OE output.</text>
  <text x="32" y="480" font-size="12">Rail rising: RESET stays low until 200 ms after ~4.43 V. Node then</text>
  <text x="32" y="496" font-size="12">jumps to 0.6 × rail = 3.0 V (3.15 V at 5.25 V). Q1 on (Vgs ≈ 3 V);</text>
  <text x="32" y="512" font-size="12">the FPGA's low now reaches the OE net → bus enabled under gateware control.</text>
  <text x="32" y="536" font-size="12">Rail falling below 4.38 V: node low within ~20 µs → Q1 off → bus disabled.</text>
  <text x="32" y="560" font-size="12">Below the supervisor's 0.7 V floor its output is undefined; the divider</text>
  <text x="32" y="576" font-size="12">caps the node at 0.6 × rail &lt; 0.42 V, so it still reads low.</text>
  <text x="32" y="600" font-size="12">Q1 orientation matters: DRAIN (pin 3) on the OE net, SOURCE (pin 2) on the FPGA pin.</text>
  <text x="32" y="616" font-size="12">Body diode (S→D) then conducts only FPGA-high → net, i.e. toward disabled.</text>
  <text x="32" y="640" font-size="12">Slot load ≈ 100 µA. RESET sinks ≈ 0.23 mA when asserted.</text>
  <text x="32" y="664" font-size="11" fill="#444">Socket-sheet enables (FPGA_GS_*_~OE): same Q1 stage each, or gateware-only.</text>
</svg>
