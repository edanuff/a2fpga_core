# ld65: flat 64 KB bank-0 image for tb_cpu_bench (+prog=)
MEMORY {
    ZP:    start = $0000, size = $0100, type = rw, define = yes;
    BANK0: start = $0000, size = $10000, type = rw, file = %O, fill = yes, fillval = $00;
}
SEGMENTS {
    ZEROPAGE: load = ZP,    type = zp;
    CODE:     load = BANK0, type = ro, start = $0800;
    RODATA:   load = BANK0, type = ro;
    VECTORS:  load = BANK0, type = ro, start = $FFE4;
}
