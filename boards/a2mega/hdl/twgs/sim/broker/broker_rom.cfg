# ld65: 128 KB test ROM for tb_gs_broker (+rom=): bank FE then bank FF, the
# layout of a ROM 01 image.  All labels are 16-bit; the code that runs in
# bank FF is reached with an explicit long jump.
MEMORY {
    BFE:    start = $0000, size = $10000, type = ro, file = %O, fill = yes, fillval = $FE;
    FFLOW:  start = $0000, size = $8000,  type = ro, file = %O, fill = yes, fillval = $FF;
    FFMAIN: start = $8000, size = $4071,  type = ro, file = %O, fill = yes, fillval = $FF;
    FFIRQ:  start = $C071, size = $008F,  type = ro, file = %O, fill = yes, fillval = $FF;
    FFCX:   start = $C100, size = $0F00,  type = ro, file = %O, fill = yes, fillval = $FF;
    FFD:    start = $D000, size = $2000,  type = ro, file = %O, fill = yes, fillval = $FF;
    FFBOOT: start = $F000, size = $0FE4,  type = ro, file = %O, fill = yes, fillval = $FF;
    FFVEC:  start = $FFE4, size = $001C,  type = ro, file = %O, fill = yes, fillval = $FF;
}
SEGMENTS {
    FEDATA:  load = BFE,    type = ro;
    MAIN:    load = FFMAIN, type = ro;
    IRQROM:  load = FFIRQ,  type = ro;
    CX:      load = FFCX,   type = ro;
    DROM:    load = FFD,    type = ro;
    BOOT:    load = FFBOOT, type = ro;
    VECTORS: load = FFVEC,  type = ro;
}
