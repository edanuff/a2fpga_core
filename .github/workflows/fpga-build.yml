name: FPGA builds

# Builds every active board with the Gowin EDA Education edition (no license
# required) and fails on synthesis/PnR errors or timing violations, using the
# same tools/build.sh gate as local builds. See docs/ci.md.

on:
  push:
    branches: [main]
    paths:
      - "hdl/**"
      - "boards/**"
      - "tools/build.sh"
      - ".github/workflows/fpga-build.yml"
  pull_request:
    paths:
      - "hdl/**"
      - "boards/**"
      - "tools/build.sh"
      - ".github/workflows/fpga-build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Education edition: builds all parts currently used by A2FPGA boards,
  # no license or registration needed. The old cdn.gowinsemi.com.cn links
  # are dead; this mirror host works (see docs/ci.md).
  GOWIN_URL: https://eda.gowinsemi.cn/Gowin_V1.9.11.03_Education_Linux.tar.gz
  # sha256 matches the AUR gowin-eda-edu 1.9.11.03 package's pinned checksum.
  GOWIN_SHA256: 6fd392f7473b24d847b6f8ebdc7a185c591826ba35d8d0e517961030d446f9f7

jobs:
  # The board matrix depends on which repo the workflow runs in, so the same
  # file works upstream (a2fpga/a2fpga_core) and in forks during the sync:
  #   upstream: a2n20v2 + the a2n20v2-Enhanced variants
  #   forks:    those plus a2mega and a2p25
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          # gprj is explicit for every entry: several boards carry extra
          # test/probe projects, and first-alphabetical selection must not
          # decide what CI builds. a2mega builds the 60K-die project only.
          common='
            { "name": "a2n20v2",                   "board": "a2n20v2",          "gprj": "a2n20v2.gprj" },
            { "name": "a2n20v2-Enhanced",          "board": "a2n20v2-Enhanced", "gprj": "a2n20v2_enhanced.gprj" },
            { "name": "a2n20v2-Enhanced-dualrate", "board": "a2n20v2-Enhanced", "gprj": "a2n20v2_enhanced_dualrate.gprj" },
            { "name": "a2n20v2-Enhanced-fb",       "board": "a2n20v2-Enhanced", "gprj": "a2n20v2_enhanced_fb.gprj" }'
          fork_only='
            { "name": "a2mega",                    "board": "a2mega",           "gprj": "a2mega.gprj" },
            { "name": "a2p25",                     "board": "a2p25",            "gprj": "a2p25.gprj" }'
          if [ "$GITHUB_REPOSITORY" = "a2fpga/a2fpga_core" ]; then
            matrix="[ $common ]"
          else
            matrix="[ $common, $fork_only ]"
          fi
          echo "matrix=$(echo "$matrix" | tr -d '\n')" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore Gowin EDA tarball from cache
        id: cache-gowin
        uses: actions/cache@v4
        with:
          path: ~/gowin-dl/gowin.tar.gz
          key: gowin-eda-${{ env.GOWIN_SHA256 }}

      - name: Download Gowin EDA (Education)
        if: steps.cache-gowin.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/gowin-dl
          curl -fL --retry 3 --retry-delay 15 --connect-timeout 30 \
            -o ~/gowin-dl/gowin.tar.gz "$GOWIN_URL"

      - name: Verify checksum and install
        run: |
          echo "$GOWIN_SHA256  $HOME/gowin-dl/gowin.tar.gz" | sha256sum -c -
          mkdir -p ~/gowin
          tar -xzf ~/gowin-dl/gowin.tar.gz -C ~/gowin
          GW_SH="$(find ~/gowin -type f -name gw_sh | head -1)"
          if [ -z "$GW_SH" ]; then
            echo "gw_sh not found in extracted tarball; layout:" >&2
            find ~/gowin -maxdepth 3 -type d >&2
            exit 1
          fi
          chmod +x "$(dirname "$GW_SH")"/* || true
          echo "GW_SH=$GW_SH" >> "$GITHUB_ENV"

      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfreetype6 libfontconfig1 libglib2.0-0 libdbus-1-3 \
            libx11-6 libx11-xcb1 libxext6 libxrender1 libxft2 libxi6 \
            libxcb1 libsm6 libice6

      - name: Build ${{ matrix.name }}
        env:
          GPRJ: ${{ matrix.gprj }}
          # build.sh's thrash watchdog defaults to 30 min, calibrated to a
          # fast local machine (~15 min healthy build). Hosted runners are
          # slower, so give legitimate builds more headroom here; the job
          # timeout still caps a truly wedged run.
          BUILD_TIMEOUT: "4800"
        run: |
          # Gowin bundles an old libfreetype in IDE/lib; the system
          # libfontconfig needs FT_Done_MM_Var from a newer one, so gw_sh
          # dies with a symbol lookup error unless the system libfreetype
          # is preloaded ahead of the bundled copy.
          LD_PRELOAD="$(ldconfig -p | awk '/libfreetype\.so\.6 /{print $NF; exit}')"
          export LD_PRELOAD
          touch "$RUNNER_TEMP/ci-build-start"
          tools/build.sh "${{ matrix.board }}"

      # impl/pnr is tracked in git, so glob uploads would pick up committed
      # bitstreams of sibling project variants — and on an early failure even
      # this project's committed files. Collect only files this build wrote
      # (newer than the marker touched right before build.sh ran).
      - name: Collect build outputs
        if: always()
        env:
          BOARD: ${{ matrix.board }}
          GPRJ: ${{ matrix.gprj }}
        run: |
          proj="${GPRJ%.gprj}"
          mkdir -p ci-out
          for f in "boards/$BOARD/impl/pnr/${proj}.fs" \
                   "boards/$BOARD/impl/pnr/${proj}_tr_content.html"; do
            if [ -f "$f" ] && [ -f "$RUNNER_TEMP/ci-build-start" ] && \
               [ "$f" -nt "$RUNNER_TEMP/ci-build-start" ]; then
              cp "$f" ci-out/
            fi
          done

      - name: Upload bitstream and timing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ci-out/
          if-no-files-found: ignore
          retention-days: 30
